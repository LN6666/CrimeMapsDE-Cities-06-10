[project]
name = "crimemapsde-cities-06-10"
version = "0.1.0"
description = "Local police-announcement source intake for German cities 06–10"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crimemapsde_cities_06_10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
